name: Calendrier économique

# Lancé chaque matin à 6h50 par la routine Claude « Réveil » (bash wake.sh calendar),
# le planificateur de GitHub étant trop irrégulier. Contrôle et relance automatiques à 7h20.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Envoyer maintenant (ignore l'heure et le « déjà envoyé »)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write # keepalive : évite la désactivation des tâches planifiées après 60 jours

concurrency:
  group: eco-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer l'état (dernier envoi)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: eco-state-${{ github.run_id }}
          restore-keys: eco-state-

      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CURRENCIES: ${{ vars.CURRENCIES || 'USD,EUR,GBP' }}
          SEND_AT: ${{ vars.SEND_AT || '07:00' }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python bot.py

      - name: Garder le visuel (onglet Actions > Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendrier
          path: out/calendrier.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: eco-state-${{ github.run_id }}

      - name: Keepalive (évite la désactivation après 60 jours sans activité)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bot.yml/enable" || true
