name: Calendrier économique

on:
  schedule:
    # Toutes les 15 min (minutes décalées : GitHub est souvent en retard à :00)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode à forcer (vide = normal)"
        type: choice
        options: ["", recap, week, alerts]
        default: ""

permissions:
  contents: read
  actions: write # nécessaire pour le keepalive (évite la désactivation après 60 jours)

concurrency:
  group: eco-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer l'état (alertes déjà envoyées, copie du calendrier)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: eco-state-${{ github.run_id }}
          restore-keys: eco-state-

      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CURRENCIES: ${{ vars.CURRENCIES || 'USD,EUR,GBP' }}
          IMPACTS: ${{ vars.IMPACTS || 'High' }}
          RECAP_HOUR: ${{ vars.RECAP_HOUR || '7' }}
          WEEK_HOUR: ${{ vars.WEEK_HOUR || '18' }}
          ALERT_MINUTES: ${{ vars.ALERT_MINUTES || '30' }}
          FORCE: ${{ inputs.mode != '' && '1' || '' }}
        run: python bot.py ${{ inputs.mode }}

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: eco-state-${{ github.run_id }}

      - name: Keepalive
        uses: gautamkrishnar/keepalive-workflow@v2
