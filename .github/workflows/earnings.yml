name: Calendrier des résultats

on:
  schedule:
    # Dimanche 18h à Paris (16h/17h UTC selon l'heure d'été/hiver) + créneaux de secours
    - cron: "5 16,17 * * 0"
    - cron: "30 16,17 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Envoyer maintenant"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eco-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer l'état
        uses: actions/cache/restore@v4
        with:
          path: state
          key: eco-state-${{ github.run_id }}
          restore-keys: eco-state-

      - name: Calendrier des résultats
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python earnings.py

      - name: Garder le visuel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats
          path: out/resultats.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: eco-state-${{ github.run_id }}
