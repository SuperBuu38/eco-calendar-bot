name: Détecteur de mouvement Nasdaq

# Le planificateur de GitHub est trop irrégulier : ce workflow tourne donc en BOUCLE
# (une vérification toutes les 5 min pendant ~5h40), puis se relance lui-même.
# Le réveil quotidien (routine Claude) le relance s'il s'est arrêté.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée de surveillance en minutes (test)"
        default: "340"
  schedule:
    - cron: "17 */6 * * *" # filet de sécurité supplémentaire

permissions:
  contents: read
  actions: write # pour se relancer et pour le keepalive

concurrency:
  group: movers
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer l'état (alertes déjà envoyées)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: movers-state-${{ github.run_id }}
          restore-keys: movers-state-

      - name: Surveiller le Nasdaq (toutes les 5 min pendant ~5h40)
        env:
          WEBHOOK_ALERTES: ${{ secrets.WEBHOOK_ALERTES }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          FAST_PCT: ${{ vars.FAST_PCT || '0.7' }}
          LEVELS: ${{ vars.LEVELS || '1.2,2,3' }}
        run: |
          end=$(( $(date +%s) + ${{ inputs.minutes || '340' }}*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python movers.py || echo "Vérification en échec, on continue."
            sleep 300
          done

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: movers-state-${{ github.run_id }}

      - name: Se relancer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run movers.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
