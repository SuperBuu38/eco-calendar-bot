name: Détecteur de mouvement Nasdaq

on:
  schedule:
    # Toutes les 15 min, du dimanche soir au vendredi soir (heures de cotation des contrats NQ)
    - cron: "2,17,32,47 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: movers
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer l'état (alertes déjà envoyées)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: movers-state-${{ github.run_id }}
          restore-keys: movers-state-

      - name: Vérifier le Nasdaq
        env:
          WEBHOOK_ALERTES: ${{ secrets.WEBHOOK_ALERTES }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          FAST_PCT: ${{ vars.FAST_PCT || '0.7' }}
          LEVELS: ${{ vars.LEVELS || '1.2,2,3' }}
        run: python movers.py

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: movers-state-${{ github.run_id }}

      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/movers.yml/enable" || true
